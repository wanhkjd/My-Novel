<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>novel-crawl · 小说采集与导入工作台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f3f5f7; color: #1f2937; padding: 24px 16px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  header h1 { font-size: 22px; font-weight: 700; }
  header p { color: #6b7280; font-size: 13px; margin-top: 4px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .card h2 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eff6ff; color: #2563eb; font-weight: 500; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: #374151; margin-bottom: 5px; }
  .field .hint { color: #9ca3af; font-size: 12px; margin-left: 4px; }
  input[type=text], input[type=file], select {
    width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 14px; background: #fff; outline: none;
  }
  input[type=text]:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; margin: 4px 0 12px; }
  .check input { width: 15px; height: 15px; }
  button.primary {
    width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
    background: #2563eb; color: #fff; font-size: 14px; font-weight: 600;
  }
  button.primary:hover { background: #1d4ed8; }
  button.primary:disabled { background: #93c5fd; cursor: not-allowed; }
  details { margin-bottom: 12px; }
  details summary { font-size: 13px; color: #6b7280; cursor: pointer; margin-bottom: 8px; }
  .msg { margin-top: 10px; font-size: 13px; border-radius: 8px; padding: 8px 10px; display: none; }
  .msg.ok { display: block; background: #ecfdf5; color: #047857; }
  .msg.err { display: block; background: #fef2f2; color: #b91c1c; }
  .tasks { margin-top: 24px; }
  .tasks h2 { font-size: 16px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f1f3f5; vertical-align: middle; }
  th { background: #f9fafb; color: #6b7280; font-weight: 500; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .status.RUNNING { background: #eff6ff; color: #2563eb; }
  .status.SUCCESS { background: #ecfdf5; color: #047857; }
  .status.FAILED { background: #fef2f2; color: #b91c1c; }
  .status.CANCELLED { background: #f3f4f6; color: #6b7280; }
  .bar { width: 130px; height: 8px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #2563eb; border-radius: 999px; transition: width .4s; }
  .pct { font-size: 12px; color: #6b7280; margin-top: 3px; }
  .cancel-btn { padding: 4px 10px; font-size: 12px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; color: #374151; }
  .cancel-btn:hover { border-color: #ef4444; color: #ef4444; }
  .detail { color: #6b7280; max-width: 320px; word-break: break-all; }
  .empty { text-align: center; color: #9ca3af; padding: 26px 0 !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 novel-crawl 小说采集与导入工作台</h1>
    <p>爬取指定小说 / 导入本地 TXT，写入 novel 数据库。任务在后台执行，下方列表实时刷新进度。</p>
  </header>

  <div class="cards">
    <!-- 爬取小说 -->
    <div class="card">
      <h2>🕷️ 爬取小说 <span class="badge">按站点规则</span></h2>
      <div class="field">
        <label>站点规则 <span class="hint">对应配置文件 novel-crawl.sources</span></label>
        <select id="c-source"></select>
      </div>
      <div class="field">
        <label>小说目录页地址 <span class="hint">书籍详情/目录所在页面的完整 URL</span></label>
        <input type="text" id="c-url" placeholder="https://某小说站/book/12345/">
      </div>
      <div class="row">
        <div class="field">
          <label>分类</label>
          <select id="c-category"></select>
        </div>
        <div class="field">
          <label>作品方向 <span class="hint">未选分类时生效</span></label>
          <select id="c-direction">
            <option value="">不设置</option>
            <option value="0">男频</option>
            <option value="1">女频</option>
          </select>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="c-override"> 覆盖重爬（删除本书已有章节后重新爬取）</label>
      <button class="primary" id="c-submit">提交爬取任务</button>
      <div class="msg" id="c-msg"></div>
    </div>

    <!-- TXT 导入 -->
    <div class="card">
      <h2>📄 TXT 导入 <span class="badge">自动识别编码 / 自动分章</span></h2>
      <div class="field">
        <label>TXT 文件 <span class="hint">推荐命名：《书名》作者：某某.txt，可自动识别</span></label>
        <input type="file" id="t-file" accept=".txt">
      </div>
      <div class="row">
        <div class="field">
          <label>书名 <span class="hint">可留空</span></label>
          <input type="text" id="t-name" placeholder="留空则从文件名解析">
        </div>
        <div class="field">
          <label>作者 <span class="hint">可留空</span></label>
          <input type="text" id="t-author" placeholder="留空则从文件名解析">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>分类</label>
          <select id="t-category"></select>
        </div>
        <div class="field">
          <label>书籍状态</label>
          <select id="t-status">
            <option value="1">已完结</option>
            <option value="0">连载中</option>
          </select>
        </div>
      </div>
      <details>
        <summary>高级选项（作品方向 / 自定义章节正则）</summary>
        <div class="field">
          <label>作品方向 <span class="hint">未选分类时生效</span></label>
          <select id="t-direction">
            <option value="">不设置</option>
            <option value="0">男频</option>
            <option value="1">女频</option>
          </select>
        </div>
        <div class="field">
          <label>自定义章节标题正则 <span class="hint">留空使用内置规则</span></label>
          <input type="text" id="t-regex" placeholder="例：^\s*第[0-9]+章.*$">
        </div>
      </details>
      <label class="check"><input type="checkbox" id="t-override"> 覆盖重导（删除本书已有章节后重新导入）</label>
      <button class="primary" id="t-submit">上传并导入</button>
      <div class="msg" id="t-msg"></div>
    </div>
  </div>

  <!-- 任务列表 -->
  <div class="tasks">
    <h2>📋 任务列表 <span class="hint" style="font-size:12px;color:#9ca3af;">每 2 秒自动刷新，重启应用后清空（数据已入库不受影响）</span></h2>
    <table>
      <thead>
        <tr>
          <th>任务ID</th><th>类型</th><th>书名</th><th>进度</th><th>状态</th><th>说明</th><th>创建时间</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="task-body">
        <tr><td colspan="8" class="empty">暂无任务</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
/** 简单的 GET JSON 封装 */
async function getJson(url) {
  const res = await fetch(url);
  return res.json();
}

/** 在指定元素上显示成功/失败提示 */
function showMsg(id, ok, text) {
  const el = document.getElementById(id);
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = text;
}

/** 加载站点规则下拉框 */
async function loadSources() {
  try {
    const r = await getJson('/api/crawl/sources');
    const sel = document.getElementById('c-source');
    sel.innerHTML = '';
    (r.data || []).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.name;
      opt.textContent = s.name + (s.remark ? '（' + s.remark + '）' : '');
      sel.appendChild(opt);
    });
    if (!sel.options.length) {
      sel.innerHTML = '<option value="">未配置站点规则</option>';
    }
  } catch (e) { /* 忽略加载失败 */ }
}

/** 加载分类下拉框（book_category 表） */
async function loadCategories() {
  try {
    const r = await getJson('/api/categories');
    const items = r.data || [];
    ['c-category', 't-category'].forEach(id => {
      const sel = document.getElementById(id);
      sel.innerHTML = '<option value="">不设置</option>';
      items.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = (c.workDirection == 1 ? '女频·' : '男频·') + c.name;
        sel.appendChild(opt);
      });
    });
  } catch (e) { /* 忽略加载失败 */ }
}

/** 提交爬取任务 */
document.getElementById('c-submit').addEventListener('click', async () => {
  const url = document.getElementById('c-url').value.trim();
  if (!url) { showMsg('c-msg', false, '请填写小说目录页地址'); return; }
  const body = {
    sourceName: document.getElementById('c-source').value || null,
    bookUrl: url,
    categoryId: document.getElementById('c-category').value || null,
    workDirection: document.getElementById('c-direction').value || null,
    override: document.getElementById('c-override').checked
  };
  const btn = document.getElementById('c-submit');
  btn.disabled = true;
  try {
    const res = await fetch('/api/crawl', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const r = await res.json();
    if (r.code == 0) {
      showMsg('c-msg', true, '任务已提交：' + r.data.id);
      refreshTasks();
    } else {
      showMsg('c-msg', false, r.message || '提交失败');
    }
  } catch (e) {
    showMsg('c-msg', false, '请求失败：' + e);
  } finally {
    btn.disabled = false;
  }
});

/** 提交 TXT 导入任务 */
document.getElementById('t-submit').addEventListener('click', async () => {
  const fileInput = document.getElementById('t-file');
  if (!fileInput.files.length) { showMsg('t-msg', false, '请选择 TXT 文件'); return; }
  const fd = new FormData();
  fd.append('file', fileInput.files[0]);
  const fields = {
    bookName: 't-name', authorName: 't-author', categoryId: 't-category',
    workDirection: 't-direction', bookStatus: 't-status', chapterRegex: 't-regex'
  };
  for (const [key, id] of Object.entries(fields)) {
    const v = document.getElementById(id).value.trim ? document.getElementById(id).value.trim() : document.getElementById(id).value;
    if (v !== '' && v != null) fd.append(key, v);
  }
  fd.append('override', document.getElementById('t-override').checked);
  const btn = document.getElementById('t-submit');
  btn.disabled = true;
  try {
    const res = await fetch('/api/txt/import', { method: 'POST', body: fd });
    const r = await res.json();
    if (r.code == 0) {
      showMsg('t-msg', true, '任务已提交：' + r.data.id);
      refreshTasks();
    } else {
      showMsg('t-msg', false, r.message || '提交失败');
    }
  } catch (e) {
    showMsg('t-msg', false, '请求失败：' + e);
  } finally {
    btn.disabled = false;
  }
});

/** 取消任务 */
async function cancelTask(id) {
  const res = await fetch('/api/tasks/' + id + '/cancel', { method: 'POST' });
  const r = await res.json();
  if (r.code != 0) alert(r.message);
  refreshTasks();
}

/** HTML 转义，防止书名/错误信息里的特殊字符破坏页面 */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/** 刷新任务列表 */
async function refreshTasks() {
  try {
    const r = await getJson('/api/tasks');
    const tasks = r.data || [];
    const body = document.getElementById('task-body');
    if (!tasks.length) {
      body.innerHTML = '<tr><td colspan="8" class="empty">暂无任务</td></tr>';
      return;
    }
    body.innerHTML = tasks.map(t => {
      const total = Number(t.total) || 0;
      const done = Number(t.done) || 0;
      const pct = total > 0 ? Math.floor(done * 100 / total) : (t.status === 'SUCCESS' ? 100 : 0);
      const statusText = { RUNNING: '执行中', SUCCESS: '成功', FAILED: '失败', CANCELLED: '已取消' }[t.status] || t.status;
      const cancelBtn = t.status === 'RUNNING'
          ? '<button class="cancel-btn" onclick="cancelTask(\'' + t.id + '\')">取消</button>' : '';
      return '<tr>'
          + '<td>' + esc(t.id) + '</td>'
          + '<td>' + (t.type === 'CRAWL' ? '爬取' : 'TXT') + '</td>'
          + '<td>' + esc(t.bookName) + '</td>'
          + '<td><div class="bar"><i style="width:' + pct + '%"></i></div>'
          + '<div class="pct">' + done + ' / ' + total + '（新增 ' + Number(t.saved || 0) + ' 章）</div></td>'
          + '<td><span class="status ' + esc(t.status) + '">' + statusText + '</span></td>'
          + '<td class="detail">' + esc(t.message) + '</td>'
          + '<td>' + esc(t.createTime) + '</td>'
          + '<td>' + cancelBtn + '</td>'
          + '</tr>';
    }).join('');
  } catch (e) { /* 忽略刷新失败，下个周期重试 */ }
}

// 页面初始化：加载下拉框数据并开始轮询任务列表
loadSources();
loadCategories();
refreshTasks();
setInterval(refreshTasks, 2000);
</script>
</body>
</html>
