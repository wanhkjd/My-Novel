#=============================================================
#                 Novel 主配置文件 (application.yml)
# 采用苍穹外卖 (sky-take-out) 风格架构设计：
# 1. 本文件负责通用组件配置与统一属性占位引用 (${novel.*})
# 2. 差异化环境配置统一在 application-dev.yml 与 application-prod.yml 中定义
#=============================================================

server:
  # 端口号
  port: 8888
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: novel
  profiles:
    # 默认激活开发环境 (dev / prod)
    active: dev
  main:
    keep-alive: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  threads:
    virtual:
      # 启用 JDK21 虚拟线程
      enabled: true

  flyway:
    enabled: ${novel.flyway.enabled:false}
    baseline-on-migrate: true

  #--------------------- 数据库配置 -------------------------
  datasource:
    url: jdbc:mysql://${novel.datasource.host}:${novel.datasource.port}/${novel.datasource.database}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${novel.datasource.username}
    password: ${novel.datasource.password}
  shardingsphere:
    enabled: ${novel.shardingsphere.enabled:false}

  #--------------------- 中间件配置 -------------------------
  data:
    redis:
      host: ${novel.redis.host}
      port: ${novel.redis.port}
      password: ${novel.redis.password}
      database: ${novel.redis.database:0}

  elasticsearch:
    enabled: ${novel.elasticsearch.enabled:false}
    uris:
      - ${novel.elasticsearch.uris}
    username: ${novel.elasticsearch.username:}
    password: ${novel.elasticsearch.password:}

  #--------------------- Spring AI 配置 ---------------------
  ai:
    openai:
      api-key: ${novel.ai.openai.api-key:demo-api-key}
      base-url: ${novel.ai.openai.base-url:https://api.openai.com}
      chat:
        options:
          model: ${novel.ai.openai.chat-model:gpt-4o-mini}
          temperature: ${novel.ai.openai.temperature:0.7}
      embedding:
        options:
          model: ${novel.ai.openai.embedding-model:text-embedding-v3}
          dimensions: ${novel.ai.openai.embedding-dims:1024}

  amqp:
    enabled: ${novel.amqp.enabled:false}
  rabbitmq:
    addresses: ${novel.rabbitmq.addresses}
    virtual-host: ${novel.rabbitmq.virtual-host}
    template:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 3s

  #--------------------- 邮件配置 ---------------------------
  mail:
    host: ${novel.mail.host}
    nickname: ${novel.mail.nickname}
    username: ${novel.mail.username}
    password: ${novel.mail.password}
    port: ${novel.mail.port:465}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          socketFactory:
            port: ${novel.mail.port:465}
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

  #--------------------- 安全与监控 -------------------------
  boot:
    admin:
      client:
        enabled: ${novel.sba.client.enabled:false}
        url: ${novel.sba.client.url:http://localhost:8080}
        username: ${novel.sba.client.username:novel}
        password: ${novel.sba.client.password:novel}
        instance:
          metadata:
            user.name: ${spring.security.user.name}
            user.password: ${spring.security.user.password}
  security:
    user:
      name: ${novel.security.user.name:ENDPOINT_ADMIN}
      password: ${novel.security.user.password:ENDPOINT_ADMIN}
      roles: ENDPOINT_ADMIN

# XXL-JOB 配置
xxl:
  job:
    enabled: ${novel.xxl-job.enabled:false}
    admin:
      addresses: ${novel.xxl-job.admin.addresses:http://127.0.0.1:8080/xxl-job-admin}
    executor:
      appname: ${novel.xxl-job.executor.appname:xxl-job-executor-novel}
      logpath: ${novel.xxl-job.executor.logpath:logs/xxl-job/jobhandler}
    accessToken: ${novel.xxl-job.accessToken:123}

# Actuator 端点管理
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    logfile:
      enabled: true
      external-file: ${novel.log.file-path:logs/novel.log}
  info:
    env:
      enabled: true
  health:
    rabbit:
      enabled: false
    elasticsearch:
      enabled: false
    mail:
      enabled: false

# 接口文档配置
springdoc:
  api-docs:
    enabled: ${novel.springdoc.enabled:false}

# Logbook 请求响应日志
logbook:
  format:
    style: http
  obfuscate:
    headers:
      - Authorization
    parameters:
      - password

#--------------------- Novel 通用业务默认配置 ----------------
novel:
  website:
    name: Novel
    link: http://localhost:1024
    support-email: support@novel.local
  jwt:
    secret: ${novel.jwt.secret:E66559580A1ADF48CDD928516062F12E}
  xss:
    enabled: true
    excludes:
      - /system/notice/*
  file:
    upload:
      path: ${novel.file.upload.path:/data/novel/uploads}
  cors:
    allow-origins:
      - http://localhost:1024
      - http://127.0.0.1:1024
      - http://localhost:8080
      - http://127.0.0.1:8080
      - http://192.168.100.129:1024
      - http://192.168.100.1:1024
      - http://192.168.*.*:1024
      - http://10.*.*.*:1024
      - https://mywsy.cc.cd
      - "*"
