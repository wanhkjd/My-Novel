#=============================================================
#                 Novel 开发环境配置 (application-dev.yml)
#集中配置 novel 下所有开发参数
#=============================================================

novel:
  # 数据源配置
  datasource:
    host: 192.168.100.129
    port: 3306
    database: novel
    username: root
    password: 123
  shardingsphere:
    enabled: true

  # Redis 缓存配置
  redis:
    host: 192.168.100.129
    port: 6379
    password: 123321
    database: 0

  # 邮件服务配置
  mail:
    host: smtp.163.com
    port: 465
    username: xxx@163.com
    password: xxx
    nickname: xxyopen

  # Elasticsearch 搜索引擎配置
  elasticsearch:
    enabled: true
    uris: http://192.168.100.129:9200
    username:
    password:

  # RabbitMQ 消息队列配置
  amqp:
    enabled: false
  rabbitmq:
    addresses: amqp://guest:guest@47.106.243.172
    virtual-host: novel

  # XXL-JOB 任务调度配置
  xxl-job:
    enabled: false
    admin:
      addresses: http://127.0.0.1:8080/xxl-job-admin
    executor:
      appname: xxl-job-executor-novel
      logpath: logs/xxl-job/jobhandler
    accessToken: 123

  # Swagger / SpringDoc 接口文档（开发环境开启）
  springdoc:
    enabled: true

  # 文件上传本地路径
  file:
    upload:
      path: ./uploads

  # JWT 密钥
  jwt:
    secret: E66559580A1ADF48CDD928516062F12E

  # AI 智能书童与大模型配置 (支持 OpenAI / DeepSeek / 通义千问 / Ollama 等兼容接口)
  ai:
    enabled: true
    vector-index-name: book_ai_vector
    embedding-dims: 1024
    openai:
      # 请通过环境变量 AI_API_KEY 注入大模型 API Key (如 DashScope / OpenAI API Key)，勿硬编码进仓库
      api-key: ${AI_API_KEY:demo-api-key}
      # 注意：Spring AI 会自动在 base-url 后拼接 /v1/chat/completions 和 /v1/embeddings，因此 URL 末尾不要带 /v1
      # 示例1 (通义千问兼容接口 - 推荐): https://dashscope.aliyuncs.com/compatible-mode
      # 示例2 (OpenAI 官方): https://api.openai.com
      # 示例3 (DeepSeek - 仅对话模型): https://api.deepseek.com
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat-model: ${AI_CHAT_MODEL:qwen3.7-plus}
      embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
      embedding-dims: 1024

# 日志输出配置
logging:
  level:
    novel: debug
